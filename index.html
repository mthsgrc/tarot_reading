<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A three-card tarot reading for the past, present, and future.">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <title>Tarot Reading</title>
</head>

<body>
    <main class="container py-4 py-md-5">
        <header class="text-center mb-4">
            <h1 class="title">..:See your Past, Present and Future:..</h1>
            <p class="subtitle">Draw three cards for a Past, Present, Future spread.</p>
        </header>

        <div class="d-grid gap-2 mb-4">
            <button id="deal-btn" type="button" class="btn btn-info btn-lg">..:Spread the Cards:..</button>
        </div>

        <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>

        <section id="reading" class="row row-cols-1 row-cols-md-3 g-4" aria-label="Three-card tarot spread">
            <div class="col">
                <div class="spread-slot">
                    <h2 class="position-label">Past</h2>
                    <div id="card-1" class="card-slot"></div>
                </div>
            </div>
            <div class="col">
                <div class="spread-slot">
                    <h2 class="position-label">Present</h2>
                    <div id="card-2" class="card-slot"></div>
                </div>
            </div>
            <div class="col">
                <div class="spread-slot">
                    <h2 class="position-label">Future</h2>
                    <div id="card-3" class="card-slot"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="cards.js" defer></script>
    <script src="script.js" defer></script>
</body>

</html>
